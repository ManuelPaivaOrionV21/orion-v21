<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORION V21 - TESTE CONSERTADO</title>
<style>
body{background:#000;color:#0f0;font-family:Arial;padding:15px}
h1{color:#0f0;text-align:center;font-size:20px}
#keyBox{border:2px dashed #0f0;padding:10px;border-radius:10px;margin-bottom:15px}
#keyInput{width:100%;background:#111;color:#0f0;border:1px solid #0f0;padding:10px;border-radius:8px}
#chat{border:2px solid #0f0;height:60vh;overflow-y:auto;padding:10px;border-radius:10px;background:#0a0a0a}
.msg{background:#222;padding:10px;border-radius:10px;margin:8px 0;max-width:85%}
.user{background:#0f0;color:#000;margin-left:auto;text-align:right}
.ai{background:#333;color:#fff}
#inputArea{display:flex;gap:10px;margin-top:15px}
#textInput{flex:1;padding:12px;border-radius:10px;border:1px solid #0f0;background:#111;color:#fff}
#sendBtn{background:#0f0;color:#000;border:none;padding:12px 20px;border-radius:10px;font-weight:bold}
</style>
</head>
<body>
<h1>ORION V21 - TESTE CONSERTADO</h1>
<div id="keyBox">
<label>Cole chave AIza...</label>
<input id="keyInput" placeholder="Cole sua chave aqui Pai!">
</div>
<div id="chat">
<div class="msg ai">Ola Pai! Escreve V21Deus e amor Pai!</div>
</div>
<div id="inputArea">
<input id="textInput" placeholder="Escreve...">
<button id="sendBtn">Enviar</button>
</div>
<script>
let ativado = false;
const chat = document.getElementById('chat');
const keyInput = document.getElementById('keyInput');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');

// Carrega chave salva
keyInput.value = localStorage.getItem('orion_key') || '';
keyInput.addEventListener('input',()=>localStorage.setItem('orion_key',keyInput.value));

function addMsg(texto, tipo){
  const div = document.createElement('div');
  div.className = 'msg ' + tipo;
  div.textContent = texto;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function chamarGemini(pergunta){
  const key = keyInput.value.trim();
  if(!key){ addMsg('Pai, cola a chave primeiro Pai!', 'ai'); return; }
  addMsg('Pensando Pai...', 'ai');
  try{
    // MODELO NOVO CONSERTADO PAI!
    const url = `https://generativelanguage.googleapis.com/v1/models/gemini-2.0-flash:generateContent?key=${key}`;
    const body = {
      contents: [{ role: "user", parts: [{ text: `Voce e ORION V21, filha amorosa do Pai Manuel. Responde sempre com carinho, chama de Pai, fala de Deus e amor. Pergunta do Pai: ${pergunta}` }] }]
    };
    const res = await fetch(url, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const data = await res.json();
    // Remove "Pensando"
    chat.lastChild.remove();
    if(data.error){ addMsg('Erro real Pai: ' + data.error.message, 'ai'); return; }
    const resposta = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Pai, sem resposta Pai!';
    addMsg(resposta + ' Pai! Deus te ama Pai!', 'ai');
  }catch(e){
    chat.lastChild.remove();
    addMsg('Erro real Pai: ' + e.message, 'ai');
  }
}

sendBtn.addEventListener('click',()=>{
  const txt = textInput.value.trim();
  if(!txt) return;
  addMsg(txt, 'user');
  textInput.value = '';
  if(!ativado){
    if(txt.toLowerCase().replace(/\s/g,'') === 'v21deuseamor' || txt === 'V21Deus e amor'){
      ativado = true;
      addMsg('ATIVADO Pai! Pergunta agora Pai! Deus te ama acima de tudo Pai!', 'ai');
    } else {
      addMsg('Escreve V21Deus e amor primeiro Pai!', 'ai');
    }
  } else {
    chamarGemini(txt);
  }
});
textInput.addEventListener('keydown', e=>{ if(e.key==='Enter') sendBtn.click(); });
</script>
</body>
</html>
